[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordrep-mof"
version = "0.3.0"
description = "Periodic coordination geometry descriptors and exact SO(3) Procrustes polyhedral shape scores (CN=2..9) for Metal-Organic Frameworks (MOFs)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "FHRMl"}
]
keywords = [
  "MOF",
  "metal-organic-frameworks",
  "coordination-chemistry",
  "procrustes",
  "continuous-shape-measures",
  "crystal-graph",
  "CGCNN"
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "ase>=3.22"
]

[tool.setuptools.packages.find]
where = ["src"]
